# ─────────────────────────────────────────────────────────────────────────────
# Creatrend Backend — Docker Compose
#
# One compose file for BOTH staging and production on the same VPS.
# Isolation is controlled by .env values:
#
#   Staging (master branch):  COMPOSE_PROJECT_NAME=creatrend-staging   HOST_PORT=5001
#   Production (main branch): COMPOSE_PROJECT_NAME=creatrend-production HOST_PORT=5000
#
# Nginx proxies:
#   staging-api.creatrend.com  → 127.0.0.1:5001
#   api.creatrend.com          → 127.0.0.1:5000
#
# Redis is internal-only (no host port). Use REDIS_URL=redis://redis:6379 in .env.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ${APP_ENV}-backend

    restart: unless-stopped

    env_file:
      - .env

    # Host port from HOST_PORT (.env) → container PORT (always 8080 inside Docker)
    ports:
      - "127.0.0.1:${HOST_PORT}:8080"

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - app_network

    healthcheck:
      # App listens on PORT=8080 inside the container (not HOST_PORT)
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:8080/health',(r)=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

    security_opt:
      - no-new-privileges:true

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"


  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine

    container_name: ${APP_ENV}-redis

    restart: unless-stopped

    # Internal only — backend connects via redis://redis:6379 on the compose network

    networks:
      - app_network

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    command: >
      redis-server
      --loglevel notice
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru

    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"


# ── Networks ─────────────────────────────────────────────────────────────────
networks:
  app_network:
    driver: bridge


# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  redis_data:
