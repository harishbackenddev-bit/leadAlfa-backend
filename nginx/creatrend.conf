# =============================================================================
# Creatrend — Nginx Reverse Proxy Configuration
#
# File location on VPS: /etc/nginx/sites-available/creatrend.conf
# Enable with:          ln -s /etc/nginx/sites-available/creatrend.conf \
#                               /etc/nginx/sites-enabled/creatrend.conf
# Test with:            nginx -t
# Reload with:          systemctl reload nginx
#
# Architecture:
#   Internet
#     │
#     ▼
#   Nginx (public 80/443)
#     │
#     ├── staging-api.creatrend.com  ──▶  127.0.0.1:5001  (staging backend)
#     └── api.creatrend.com          ──▶  127.0.0.1:5000  (production backend)
#
# Ports 5000 and 5001 are bound to 127.0.0.1 by Docker Compose.
# Redis ports are NEVER exposed. Nginx cannot reach them.
# =============================================================================


# ── Upstream definitions ──────────────────────────────────────────────────────
# Define backend upstreams separately for clean configuration and future
# load-balancing support. Keepalive maintains persistent connections to the
# Node processes, improving performance.

upstream creatrend_staging {
    server 127.0.0.1:5001;
    keepalive 32;
}

upstream creatrend_production {
    server 127.0.0.1:5000;
    keepalive 32;
}


# ── HTTP → HTTPS redirect (all domains) ──────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.creatrend.com staging-api.creatrend.com;

    # Allow Let's Encrypt ACME challenge for SSL certificate renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}


# ── Staging API: staging-api.creatrend.com ───────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name staging-api.creatrend.com;

    # SSL certificates (managed by Certbot / Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/staging-api.creatrend.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-api.creatrend.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Allow large media uploads (up to 105MB; application limit is 100MB)
    client_max_body_size 105M;
    client_body_timeout  120s;

    # Proxy timeouts (generous for long-running requests and large uploads)
    proxy_connect_timeout 60s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    # Main proxy pass to staging backend
    location / {
        proxy_pass http://creatrend_staging;

        # Standard proxy headers
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;

        # WebSocket / Socket.IO upgrade headers
        # Required for the Socket.IO handshake and persistent WebSocket connection
        proxy_set_header    Upgrade           $http_upgrade;
        proxy_set_header    Connection        "upgrade";

        # Disable buffering for streaming / Server-Sent Events
        proxy_buffering     off;

        # Pass cookies through (required for session handling if used)
        proxy_pass_header   Set-Cookie;
    }

    # Socket.IO specific location (polling + WebSocket transports)
    location /socket.io/ {
        proxy_pass http://creatrend_staging;

        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;

        # Critical for WebSocket upgrade
        proxy_set_header    Upgrade           $http_upgrade;
        proxy_set_header    Connection        "upgrade";

        # Disable buffering — required for Socket.IO long-polling
        proxy_buffering     off;

        # Extended timeout for persistent WebSocket connections
        proxy_read_timeout  86400s;
    }
}


# ── Production API: api.creatrend.com ────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.creatrend.com;

    # SSL certificates (managed by Certbot / Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/api.creatrend.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.creatrend.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS for production only (not staging — avoids browser caching issues during testing)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Allow large media uploads (up to 105MB; application limit is 100MB)
    client_max_body_size 105M;
    client_body_timeout  120s;

    # Proxy timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    # Main proxy pass to production backend
    location / {
        proxy_pass http://creatrend_production;

        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;

        proxy_set_header    Upgrade           $http_upgrade;
        proxy_set_header    Connection        "upgrade";

        proxy_buffering     off;
        proxy_pass_header   Set-Cookie;
    }

    # Socket.IO specific location
    location /socket.io/ {
        proxy_pass http://creatrend_production;

        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;

        proxy_set_header    Upgrade           $http_upgrade;
        proxy_set_header    Connection        "upgrade";

        proxy_buffering     off;
        proxy_read_timeout  86400s;
    }
}
