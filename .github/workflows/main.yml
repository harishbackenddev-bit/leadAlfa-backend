name: Build and Delopy Production

on:
  push:
    branches: [ main ]


jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.16.0]

    steps:
      # 1. Pull the repository files into the runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up the specific Node.js version and enable caching
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # 3. Install dependencies and Build
      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build --if-present

        # 4. Connect to remote server and execute commands
      - name: Execute remote SSH commands
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASS }}
          port: 22
          script: |
            bash -lc '
              cd /var/www/production-creaternd
              git checkout main
              git pull origin main 
              docker-compose down
              docker-compose build
              docker-compose up -d
            '
